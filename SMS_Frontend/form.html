<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add / Edit Student</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <div class="navbar-left">
        <h1>Student Management</h1>
        <span class="navbar-tag">Admin Panel</span>
      </div>
      <nav class="navbar-actions">
        <a href="dashboard.html" class="navbar-link">Dashboard</a>
        <button type="button" class="navbar-link navbar-logout" onclick="logout()">Logout</button>
      </nav>
    </div>
  </header>

  <main class="container container-narrow">

    <a href="index.html" class="back-link">&larr; Back to student list</a>

    <div class="form-card">
      <h2 id="form-heading">Add Student</h2>
      <p class="form-subtitle" id="form-subtitle">Fill in the details below and save.</p>

      <form id="student-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Rahul Sharma" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="e.g. 21" min="13" required>
          </div>

          <div class="form-group">
            <label for="course">Course</label>
            <input type="text" id="course" name="course" placeholder="e.g. B.Tech CSE" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="e.g. rahul.sharma@email.com" required>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Save Student</button>
          <a href="index.html" class="btn btn-cancel">Cancel</a>
        </div>
      </form>
    </div>

  </main>

  <script src="auth.js"></script>
  <script src="form.js"></script>
</body>
</html>
