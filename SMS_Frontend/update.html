<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Student</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <div class="navbar-left">
        <h1>Student Management</h1>
        <span class="navbar-tag">Admin Panel</span>
      </div>
      <nav class="navbar-actions">
        <a href="dashboard.html" class="navbar-link">Dashboard</a>
        <button type="button" class="navbar-link navbar-logout" onclick="logout()">Logout</button>
      </nav>
    </div>
  </header>

  <main class="container container-narrow">
    <a href="dashboard.html" class="back-link">&larr; Back to dashboard</a>

    <div class="form-card">
      <h2>Update Student</h2>
      <p class="form-subtitle">Enter a Student ID to load their details.</p>

      <div class="lookup-row">
        <input type="number" id="lookup-id" placeholder="Student ID" min="1">
        <button type="button" class="btn btn-primary" id="load-btn">Load</button>
      </div>

      <p class="error-text" id="lookup-error"></p>

      <form id="update-form" class="hidden">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="13" required>
          </div>

          <div class="form-group">
            <label for="course">Course</label>
            <input type="text" id="course" name="course" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <p class="success-text" id="success-text"></p>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save Changes</button>
          <a href="dashboard.html" class="btn btn-cancel">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <script src="auth.js"></script>
  <script src="update.js"></script>
</body>
</html>
